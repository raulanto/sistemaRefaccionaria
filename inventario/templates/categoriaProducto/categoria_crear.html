{% extends 'base/body.html' %} {% block headercontect %}
    {% include 'base/header/overlapHeader.html' %}
{% endblock %}
{% block content %}
    <div class="container-fluid mt-n10">

    <div class="card shadow">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h4 class="mb-0">
                <i class="fas fa-box"></i>
                Nueva Categoria de Producto
            </h4>
            <a href="{% url 'inventario:categoriaLista' %}" class="btn btn-secondary btn-sm">
                <i class="fas fa-arrow-left"></i>
                Volver
            </a>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <!-- ========================= -->
                <!-- INFORMACIÓN GENERAL -->
                <!-- ========================= -->
                {% if form.errors %}
                <div class="alert alert-danger">
                    {{ form.errors }}
                </div>
                {% endif %}
                <h5 class="text-primary mb-3">
                    Información General
                </h5>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label>Nombre</label>
                        {{ form.nombre }}
                    </div>
                </div>
                <hr>
                <!-- BOTONES -->
                <div class="text-end">
                    <button type="reset" class="btn btn-warning">
                        <i class="fas fa-eraser"></i>
                        Limpiar
                    </button>
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save"></i>
                        Guardar Producto
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
