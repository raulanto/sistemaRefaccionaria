<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — Refaccionaria M&V</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #fff;
        }
        .split-container {
            display: flex;
            min-height: 100vh;
        }

        /* PANEL IZQUIERDO — NEGRO CON MARCA */
        .brand-panel {
            flex: 1;
            background: #141414;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(214,49,49,.25) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(214,49,49,.15) 0%, transparent 50%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 40px;
            text-align: center;
        }
        .brand-panel i {
            font-size: 3.5rem;
            color: #d63131;
            margin-bottom: 20px;
        }
        .brand-panel h1 {
            font-weight: 800;
            font-size: 2rem;
            margin-bottom: 8px;
            letter-spacing: .5px;
        }
        .brand-panel p {
            color: #aaa;
            font-size: .95rem;
            max-width: 320px;
            margin: 0;
        }
        .brand-panel .accent-line {
            width: 60px;
            height: 4px;
            background: #d63131;
            border-radius: 2px;
            margin: 18px 0;
        }

        /* PANEL DERECHO — FORMULARIO BLANCO */
        .form-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: #fff;
        }
        .form-wrapper {
            width: 100%;
            max-width: 360px;
        }
        .form-wrapper h4 {
            font-weight: 700;
            color: #141414;
            margin-bottom: 4px;
        }
        .form-wrapper p.subtitle {
            color: #777;
            font-size: .9rem;
            margin-bottom: 28px;
        }
        .form-label {
            color: #141414;
            font-size: .85rem;
            font-weight: 600;
        }
        .form-control {
            border: 1.5px solid #ddd;
            border-radius: 8px;
            padding: 12px 14px;
        }
        .form-control:focus {
            border-color: #d63131;
            box-shadow: 0 0 0 .2rem rgba(214, 49, 49, .15);
        }
        .btn-entrar {
            background: #d63131;
            border: none;
            color: #fff;
            font-weight: 700;
            padding: 12px;
            border-radius: 8px;
            transition: background .15s ease;
        }
        .btn-entrar:hover { background: #b91c1c; color: #fff; }
        .alert-custom {
            background: rgba(214, 49, 49, .08);
            border: 1px solid #d63131;
            color: #b91c1c;
            border-radius: 8px;
            font-size: .85rem;
        }

        /* En celular, el panel negro se apila arriba, más pequeño */
        @media (max-width: 767px) {
            .split-container { flex-direction: column; }
            .brand-panel { flex: none; padding: 30px 20px; }
            .brand-panel i { font-size: 2.2rem; margin-bottom: 10px; }
            .brand-panel h1 { font-size: 1.4rem; }
            .brand-panel p { display: none; }
            .form-panel { flex: none; padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="split-container">

        <div class="brand-panel">
            <i class="fas fa-boxes"></i>
            <h1>Refaccionaria M&V</h1>
            <div class="accent-line"></div>
            <p>Sistema de control de inventario, ventas y bodega.</p>
        </div>

        <div class="form-panel">
            <div class="form-wrapper">
                <h4>Bienvenido</h4>
                <p class="subtitle">Inicia sesión con tu usuario para continuar</p>

                {% if form.errors %}
                <div class="alert alert-custom mb-3">
                    <i class="fas fa-exclamation-circle"></i>
                    Usuario o contraseña incorrectos.
                </div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input type="text" name="username" class="form-control" placeholder="Tu usuario" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-entrar w-100">
                        <i class="fas fa-sign-in-alt"></i> Entrar
                    </button>
                </form>
            </div>
        </div>

    </div>

</body>
</html>
