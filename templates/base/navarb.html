<nav class="topnav navbar navbar-expand shadow navbar-light bg-white" id="sidenavAccordion">
    <a class="navbar-brand d-none d-sm-block" href="{% url 'inventario:dashboard' %}">Refaccionaria M&V</a>
    <button class="btn btn-icon btn-transparent-dark order-1 order-lg-0 mr-lg-2" id="sidebarToggle" href="#">
        <i data-feather="menu"></i>
    </button>
    <form class="form-inline mr-auto d-none d-lg-block">
        <input class="form-control form-control-solid mr-sm-2" type="search" placeholder="Buscar" aria-label="Buscar"/>
    </form>

    <ul class="navbar-nav align-items-center ml-auto">

        <li class="nav-item dropdown no-caret mr-3 dropdown-user">
            <a class="dropdown-toggle text-decoration-none d-flex align-items-center gap-3 px-2" id="navbarDropdownUserImage"
                href="javascript:void(0);" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"
                style="color: inherit;">
                <span class="d-flex align-items-center justify-content-center rounded-circle bg-primary text-white mr-2"
                    style="width:36px; height:36px; flex-shrink:0;">
                    <i data-feather="user" style="width:18px; height:18px;"></i>
                </span>
                <span class="d-none d-md-inline fw-semibold">{{ request.user.get_full_name|default:request.user.username }}</span>
            </a>
            <div class="dropdown-menu dropdown-menu-right border-0 shadow animated--fade-in-up"
                 aria-labelledby="navbarDropdownUserImage">
                <h6 class="dropdown-header d-flex align-items-center">
                    <div class="dropdown-user-details">
                        <div class="dropdown-user-details-name">{{ request.user.get_full_name|default:request.user.username }}</div>
                        <div class="dropdown-user-details-email">{{ request.user.email|default:"Sin correo registrado" }}</div>
                    </div>
                </h6>
                <div class="dropdown-divider"></div>

                <form method="POST" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="dropdown-item border-0 bg-transparent w-100 text-start">
                        <div class="dropdown-item-icon"><i data-feather="log-out"></i></div>
                        Cerrar sesión
                    </button>
                </form>
            </div>
        </li>

    </ul>
</nav>
